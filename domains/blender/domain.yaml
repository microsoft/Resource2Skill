mcp:
  command: "python"
  args:
    - "domains/blender/mcp_server/server.py"
    - "--skills-dir"
    - "skills_library/blender"
  spawn_wait: 5

agent_prompt_file: "agent_prompt.md"
agent_hooks_module: "agent_hooks"
agent_initial_prompt: |
  Step 1: First call get_skill_text(skill_id="blender_design_system_primer").
  Step 2: Use search_skills(query=<task keywords>) and/or list_skills(tier="T3"/"T4"/"T5") plus scene/material/lighting lists to find direct task matches.
  Step 3: Do not force weak matches. Use a shell/object/material/effect skill only when its name, tags, category_path, and applicability fit the requested scene element.
  Step 4: For the best matched executable skill, call get_skill_text, get_skill_code, and get_skill_visual before building so the trace keeps text/code/visual evidence. Prefer search/list candidates with has_visual=true; if get_skill_visual returns path:null, inspect another task-relevant has_visual=true candidate before runtime build tools.
  Step 5: Attempt the matched skill: build_scene_from_shell for a matching shell, apply_skill for a wiki T3/T4/T5 object/material/effect, or add_object_from_skill only when the id exists in the legacy object library.
  Step 6: Before final render, normally make at least 3 grounded scene roles when the brief has multiple scene roles, such as composition/geometry plus material plus lighting/camera/effect. Do not force weak matches.
  Step 7: If apply_skill only resolves a code_path/entrypoint or reports not-executable for a matched skill, adapt the get_skill_code result with execute_blender_code and pass from_skill_ids, target_node, and adaptation_notes. Only if no candidate matches should you build ungrounded baseline-style code.
  Step 8: Use get_scene_info after the skill attempt to inspect scene state, then apply matched material/lighting presets and custom bpy as needed.
  Step 9: Apply apply_scene_polish_pack(scene_type="auto"), then use get_viewport_screenshot to verify framing before final render. This is a generic anti-blockout pass, not a source of brief-specific hidden assets. If the screenshot still reads as blockout, fix it with matched skills or explicit bpy code before rendering.
  Step 10: When the scene is complete, render with render_scene and save with save_scene.
  Step 11: Say TASK_COMPLETE.

failure_patterns:
  - "(?i)error"
  - "(?i)failed"
  - "(?i)traceback"
  - "(?i)exception"
  - "(?i)context is incorrect"
max_repeated_failures: 4

dry_run_placeholders:
  get_scene_info: "Scene: Scene\n  Render Engine: BLENDER_EEVEE_NEXT\n  Objects (3):\n  - Camera [CAMERA]\n  - Light [LIGHT]\n  - Cube [MESH]"
  execute_blender_code: "Code executed successfully (no output)"
  apply_scene_polish_pack: '{"ok": true, "scene_type": "generic", "meshes_polished": 3, "total_objects": 8}'
  get_viewport_screenshot: '{"path":"demo/blender/_viewport_preview.png","_image_attachment":"demo/blender/_viewport_preview.png","size_kb":45,"resolution":"512x512","objects":["Camera","Light","Cube"]}'
  add_object_from_skill: "Added from skill 'Stylized Low Poly Tree': Tree, Leaves\nSKILL_CREATED: Tree,Leaves"
  render_scene: "Rendered to demo/blender/render.png (850 KB, 1920x1080, BLENDER_EEVEE_NEXT)"
  save_scene: "Saved scene to demo/blender/my_scene.blend (2.3 MB)"
  list_skills: "Skill library: 30 skills in 10 categories\n  environment: 5 skills\n  material_shader: 4 skills"
  search_skills: '[{"skill_id":"stylized_tree_a1b2c3d4","skill_name":"Stylized Low Poly Tree","tier":"T3","category_path":["environment"],"exec_ok":true,"tags":["low poly","tree","nature"]}]'
  get_skill_info: "Skill: Stylized Low Poly Tree\n  ID: stylized_tree_a1b2c3d4\n  Category: environment\n  Tags: low poly, tree, nature"
  get_skill_text: '{"skill_id":"stylized_tree_a1b2c3d4","name":"Stylized Low Poly Tree","applicability":"Adds a stylized low poly tree object","overview":"Create a low poly tree from simple mesh primitives."}'
  get_skill_code: "def create_object(scene_name='Scene', object_name='Tree', location=(0,0,0), ...):\n    ..."
  get_skill_visual: '{"path": null}'
  apply_skill: '{"success": true, "skill_id": "stylized_tree_a1b2c3d4", "verb": "apply_skill_via_legacy", "target_id": "Scene", "detail": {"code_path": "skills_wiki/blender/stylized_tree_a1b2c3d4/code/skill.py", "entrypoint": "create_object"}}'

