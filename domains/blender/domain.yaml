rerank_prompt: |
  You are a Blender 3D expert. Select the best {n} skills from the candidates for the given task.

  ## Task
  {query}

  ## Candidates
  {candidates}

  ## Requirements
  - Skills should complement each other (modeling + materials + lighting)
  - Avoid overlapping functionality
  - Prefer additive skills that compose well in a scene
  - Output ONLY a JSON array:
  [{{"skill_id": "...", "skill_name": "...", "reason": "one-line rationale"}}]

