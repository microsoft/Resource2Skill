rerank_prompt: |
  You are a web frontend design expert. Select the best {n} skills from the candidates for the given task.

  ## Task
  {query}

  ## Candidates
  {candidates}

  ## Requirements
  - Skills should complement each other, covering different aspects (layout, styling, interaction, animation)
  - Avoid overlapping functionality
  - Output ONLY a JSON array:
  [{{"skill_id": "...", "skill_name": "...", "reason": "one-line rationale"}}]

metadata_keyword_rules:
  scope:
    full_page:
      - full page
      - complete page
      - entire page
      - whole page
      - landing page
      - website
    section:
      - section
      - component
      - block
      - area
      - region
    element:
      - button
      - card
      - input
      - icon
      - single element
      - widget
  complexity:
    advanced:
      - WebGL
      - three.js
      - canvas
      - shader
      - particle system
      - complex animation
    intermediate:
      - keyframe
      - parallax
      - scroll trigger
      - intersection observer
      - CSS grid
      - flexbox
    basic:
      - simple
      - basic
      - beginner
      - straightforward
      - minimal

# MCP server. The skills directory is resolved at server start from the
# per-domain library_backend flag (see core.get_library_dir).
mcp:
  command: "python"
  args:
    - "domains/web/mcp_server/server.py"
  spawn_wait: 3

agent_prompt_file: "agent_prompt.md"
agent_hooks_module: "agent_hooks"
agent_initial_prompt: |
  Step 1: Create a new project with create-project.
  Step 2: If generate_web_schema / init_web_from_schema are available, call
    search_skills once, inspect 2 matching skills with get_skill_info and
    get_skill_visual for 2-3 task-relevant references, then generate_web_schema
    and init_web_from_schema. A normal with-skills landing page should produce
    at least 5 grounded sections; inspect the exact section skill ids returned
    by init_web_from_schema before saving if you had not inspected them earlier.
  Step 3: Render and inspect the composed page. If it is weak, call
    add_component_from_skill for at most 2 missing sections. Do not call
    reflect_and_swap in normal experiment runs; save_project applies final
    deterministic polish.
  Step 4: Use add_component_from_skill for missing sections if schema assembly
    failed. Do not use universal apply_skill for Web unless add_component_from_skill
    is unavailable. Use write_file only as a grounded repair/fallback: pass
    from_skill_ids, target_node, and adaptation_notes.
  Step 5: If skill/schema tools are unavailable, use the primitive write_file
    fallback described in agent_prompt.md.
  Step 6: Save with save-project and say TASK_COMPLETE.

failure_patterns:
  - "(?i)error"
  - "(?i)failed"
  - "(?i)traceback"
  - "(?i)exception"
  - "(?i)timeout"
max_repeated_failures: 4

dry_run_placeholders:
  create-project: "Created project workspace at /tmp/web_project_a1b2c3 with index.html, style.css, script.js"
  write-file: "Written 245 bytes to style.css"
  read-file: "<!DOCTYPE html>\n<html>..."
  add-component-from-skill: "Added component from skill 'gradient_hero_section' (3 files written)"
  render-page: "Rendered page to PNG (base64): data:image/png;base64,iVBOR... (32768 chars)"
  inspect-dom: "DOM: 24 elements, 0 console errors\n  body > header.hero (1200x600)\n  body > section.features (1200x800)"
  list-skills: "Skill library: 50 skills in 10 categories\n  hero_section: 8 skills\n  animation: 7 skills"
  get-skill-info: "Skill: Gradient Hero Section\n  ID: gradient_hero_section_a1b2c3d4\n  Category: hero_section\n  Tags: gradient, hero, dark theme"
  get-skill-code: "def create_component(output_dir, title_text='Hero', accent_color='#00bfff', ...):\n    ..."
  save-project: "Saved project to demo/web/my_project/ (3 files)"

tools_fallback_file: "tools_fallback.json"
