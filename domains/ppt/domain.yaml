      - no transition
      - static

mcp:
  command: "python"
  args:
    - "domains/ppt/mcp_server/server.py"
    - "--skills-dir"
    - "skills_library/ppt"
  env:
    AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  spawn_wait: 2

# Agent configuration
agent_prompt_file: "agent_prompt_v2.md"
agent_hooks_module: "agent_hooks"
# Legacy v1 agent_initial_prompt has been retired. The live deck-build path
# is Theme × Shell × Archetype (see agent_prompt_v2.md). The agent uses
# add_slide_from_shell + select_shell + pick_archetype. Explicit brief slide
# counts win; otherwise the archetype dictates the length.
agent_initial_prompt: |
  Use the v2 Theme × Shell × Archetype pipeline documented in
  agent_prompt_v2.md. The scaffold (pick_archetype, pick_theme,
  select_shell, add_slide_from_shell) is shared by both arms. If the wiki
  skill-discovery tools (list_skills/search_skills/get_skill_text/
  get_skill_code/get_skill_visual) are present, perform discovery first:
  call list_skills and/or search_skills, then inspect exactly two long-tail
  visual/animation/layout reference skills with get_skill_text,
  get_skill_code, and get_skill_visual. These wiki skills are design
  references only; the v2 shell/archetype system is the scaffold and must
  not be claimed as a long-tail skill. If those tools are not present,
  skip discovery and go straight to the scaffold. Either way, create the
  presentation, call pick_archetype(task_description, prs_id=<your id>) and
  include any explicit requested slide count in task_description so
  save_presentation can lint against that target; otherwise use the
  archetype's suggested count. Use add_slide_from_shell for every slide.
  When wiki tools are present, pass the inspected skill IDs via
  design_reference_skill_ids on add_slide_from_shell so deck-plan.json and
  slide notes contain an audit trace. Additionally, in with_skills runs,
  call `add_slide_from_skill(prs_id, skill_id=<wiki_skill_id>, content_brief=...)`
  for 2-3 hero/visual slides — this actually executes the wiki skill's
  python-pptx code from skills_wiki/ppt. Do NOT call the legacy add_slide,
  replace_slide, or get_technique_snippet tools.

# Stuck-loop detection
failure_patterns:
  - "(?i)error"
  - "(?i)failed"
  - "(?i)traceback"
  - "(?i)exception"
max_repeated_failures: 3

# Dry-run placeholders
dry_run_placeholders:
  create-presentation: "Created presentation prs_a1b2c3d4 (16:9, 13.33x7.50 inches)"
  add-slide: "Added slide 1 (12 shapes)"
  add-slide-from-skill: "Added slide 1 from skill 'skill_abc12345' (18 shapes)"
  replace-slide: "Replaced slide 1 (15 shapes)"
  delete-slide: "Deleted slide 1. Presentation now has 5 slides."
  save-presentation: "Saved 6-slide presentation to /tmp/output.pptx"
  get-slide-info: "Slide 1: 12 shapes\n  Shape types: {'FREEFORM (17)': 5, 'AUTO_SHAPE (1)': 4, 'PICTURE (13)': 2, 'TEXT_BOX (17)': 1}\n  Text: Company Name; Innovation Drives Growth\n  Dimensions: 13.33 x 7.50 inches"
  render-slide: "Rendered slide 1 to PNG (base64): data:image/png;base64,iVBOR... (24576 chars)"
  list-skills: "Skill library: 1164 skills in 16 categories\n  cover_divider: 120 skills\n  typography: 95 skills"
  get-skill-info: "Skill: Gradient Card Layout\n  ID: gradient_card_layout_a1b2c3d4\n  Category: layout\n  Tags: card_grid, gradient_bg, split_layout"

# Dry-run tool schema file
tools_fallback_file: "tools_fallback.json"
