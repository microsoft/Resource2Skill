rerank_prompt: |
  你是 PPT 设计专家。根据任务需求，从候选技能中选择最合适的 {n} 个组合。

  ## 任务
  {query}

  ## 候选技能
  {candidates}

  ## 要求
  - 选择的技能应互补，覆盖不同方面（布局、配色、动画等）
  - 避免功能重叠的技能
  - 只输出 JSON 数组，不要其他文字:
  [{{"skill_id": "...", "skill_name": "...", "reason": "一句话理由"}}]

# PPT-specific metadata keyword rules
