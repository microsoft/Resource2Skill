      - two-slide
    single:
      - single slide
      - one slide
      - standalone
  layer:
    transition:
      - morph transition
      - slide transition
      - transition effect
      - morph between
      - morph animation
      - fade transition
      - push transition
      - wipe transition
    visual:
      - layout
      - color scheme
