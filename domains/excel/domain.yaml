# Reranker prompt for skill candidate selection (used by skill_retriever)
rerank_prompt: |
  你是 Excel 设计专家。从下列技能候选中挑选 {top_k} 个最适合任务 "{task}" 的技能。

  ## 候选
  {candidates}

  ## 要求
  - 选择的技能应互补，覆盖不同方面（数据布局、公式、图表、配色等）
  - 优先 archetype/sheet_shell 作为骨架，components 作为补充
  - 避免功能重叠的技能
  - 只输出 JSON 数组，不要其他文字:
  [{{"skill_id": "...", "skill_name": "...", "reason": "一句话理由"}}]

