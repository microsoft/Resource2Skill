      - 进阶

# MCP server (self-built, openpyxl-native).
# The skills directory is resolved at server start from the per-domain
# library_backend flag (see core.get_library_dir). Do not pass --skills-dir
# here unless overriding for a one-off run; doing so bypasses the cutover flag.
mcp:
  command: "python"
  args:
    - "domains/excel/mcp_server/server.py"
    - "--demo-dir"
    - "demo/excel"
  env:
    AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  spawn_wait: 1

# Agent configuration
agent_prompt_file: "agent_prompt.md"
agent_hooks_module: "agent_hooks"
agent_initial_prompt: |
  Build the workbook through the with-skills path when those tools are available:
    1. First call get_skill_text(skill_id="excel_design_system_primer").
    2. Use search_skills(query=<task keywords>) and/or list_skills(tier="archetype"/"sheet_shell"/"component") to find direct task matches.
    3. Do not force a weak archetype. Use an archetype only when its name/category/applicability directly matches the requested workbook.
    4. For the best matched executable skill, call get_skill_text, get_skill_code, and get_skill_visual before building so the trace keeps text/code/visual evidence.
    5. Create the workbook, then attempt the matched skill with apply_skill, init_from_archetype, add_sheet_from_shell, or apply_component as appropriate; or adapt inspected skill code through execute_xlsx_code.
    6. Before saving, normally make at least 3 grounded workbook roles when the brief has multiple workbook parts: one structure/archetype/shell, one dashboard/chart/table/component, and one formula/format/reporting polish role. Do not force weak matches.
    7. If the matched skill is not executable, adapt its get_skill_code result via execute_xlsx_code with from_skill_ids, target_node, and adaptation_notes. Only if no candidate matches the task should you skip to ungrounded baseline-style code.
    8. save_workbook to demo/excel/<name>.xlsx, then verify_workbook
  Say TASK_COMPLETE when the file is verified.

# Stuck-loop detection
failure_patterns:
  - "(?i)error"
  - "(?i)traceback"
  - "(?i)exception"
  - "(?i)not found"
max_repeated_failures: 3

# Dry-run placeholders (for cli.py agent --dry-run without live MCP)
