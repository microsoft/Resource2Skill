rerank_prompt: 'You are a music production expert. Select the best {n} skills from
  the candidates for the given task.


  ## Task

  {query}


  ## Candidates

  {candidates}


  ## Requirements

  - Skills should complement each other (drums + bass + melody + effects)

  - Avoid overlapping functionality (don''t pick two drum patterns unless genre-varied)

  - Prefer skills that compose well in a mix (frequency range separation)

  - Output ONLY a JSON array:

  [{{"skill_id": "...", "skill_name": "...", "reason": "one-line rationale"}}]

  '
metadata_keyword_rules:
  scope:
    project:
    - full track
    - complete beat
    - song
    - arrangement
    track:
    - single track
    - one track
    - instrument
    - stem
    clip:
    - MIDI item
    - pattern
    - loop
    - clip
  complexity:
    advanced:
    - sidechain
    - automation
    - mastering chain
    - multiband
    - frequency spectrum
    intermediate:
    - chord progression
    - drum variation
    - effects chain
    - EQ
    - compression
    basic:
    - simple beat
    - basic pattern
    - single note
    - beginner
    - four on the floor
mcp:
  command: python
  args:
  - domains/reaper/mcp_server/server.py
  - --skills-dir
  - skills_library/reaper
  env:
    AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
  spawn_wait: 3
agent_prompt_file: agent_prompt.md
agent_hooks_module: agent_hooks
agent_initial_prompt: 'Step 1: Load the primer first with get_skill_text(skill_id="music_theory_essentials_primer").

  Step 2: Search task-fit skills with search_skills. The query must include the
  brief genre, BPM/tempo, and key/scale when present, plus likely roles such as
  drums, bass, harmony, melody, and arrangement.

  Step 3: Inspect candidate skills before use. For at least the final skills you
  intend to apply, call get_skill_info, get_skill_text, get_skill_code, and get_skill_visual
  so selection uses text/code/visual multimodal evidence.

  Step 4: Write a 3-line plan: BPM, key/scale, sections. Do not call get_project_info
  before primer/search/inspection.

  Step 5: Use apply_skill at least 4 times when direct matches
  exist, for distinct roles (for example rhythm, bass, harmony, melody, arrangement,
  or mix/FX). Pass kwargs_json matching the brief, including bpm, key, scale,
  and full bars.

  Step 6: If apply_skill returns detail.mode="code_ready", immediately execute
  detail.run_snippet with execute_reaper_code and include from_skill_ids,
  target_node, and adaptation_notes. If it returns recipe_only, translate
  the recipe into create_track and add_midi_notes calls.

  Step 7: Maintain the density floor: call arrange_project_sections(total_bars=<brief bars>, pattern_bars=8, style=<genre>) after the role skills. It extends short snippets and creates intro/main/breakdown/final energy changes. Aim for at least 5 tracks and add appropriate FX.

  Step 8: Render with render_project by iteration 25 (use style= for genre-appropriate
  FX), then review with review_audio and read the scores and fixes.

  Step 9: If review flags sparse low end, weak transients, unbalanced spectrum,
  or flat arrangement, apply fixes (especially arrange_project_sections plus
  drum fills / lead accents), then re-render and re-review.

  Step 10: When acceptable or 2 revisions are done, save_project and say TASK_COMPLETE.

  '
failure_patterns:
- (?i)error
- (?i)failed
- (?i)traceback
- (?i)exception
- (?i)reascript
max_repeated_failures: 4
dry_run_placeholders:
  get_project_info: "Project: Untitled\n  Tempo: 120.0 BPM\n  Time Sig: 4/4\n  Tracks\
    \ (2):\n  - Track 1 [MIDI] 0 items\n  - Track 2 [AUDIO] 0 items"
  execute_reaper_code: Code executed successfully (no output)
  create_midi_item: 'Created MIDI item on Track 1: position=0.0, length=4.0 bars'
  add_midi_notes: 'Added 16 MIDI notes to item on Track 1 (pitches: C3-G4, velocities:
    80-120)'
  set_tempo: Tempo set to 85.0 BPM
  create_track: Created track 'Piano' at index 3
  add_fx: 'Added VST: ReaSynth to Track 1'
  render_project: Rendered to demo/reaper/my_track.wav (3.2 MB, 44100 Hz, 16 bars)
  save_project: Saved project to demo/reaper/my_track.rpp (45 KB)
  apply_skill: 'Applied skill ''Boom Bap Drum Pattern'': created Track ''Drums'' with
    1 MIDI item (32 notes)

    SKILL_CREATED: Drums'
  list_skills: "Skill library: 30 skills in 8 categories (12 verified)\n  drums: 6\
    \ skills (4 verified)\n  chords: 5 skills (3 verified)"
  get_skill_info: "Skill: Boom Bap Drum Pattern\n  ID: boom_bap_drums_a1b2c3d4\n \
    \ Category: drums\n  Tags: hip-hop, boom bap, kick, snare, hi-hat"
  get_skill_code: "def create_pattern(project_name='MyProject', track_name='Drums',\
    \ bpm=90, ...):\n    ..."
